<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Workspace - Kanban</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase App & Database Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

    <!-- Header Section -->
    <header class="app-header">
        <h1>My Workspace</h1>
        <div class="header-actions">
            <button id="open-modal-btn" class="btn-primary">➕ New Task</button>
            <button id="theme-toggle" class="btn-secondary">🌙 Dark Mode</button>
        </div>
    </header>

    <!-- Banner Informasi Mode Viewer (Hanya muncul jika bukan Admin) -->
    <div id="viewer-banner" style="display: none; background: #1e293b; color: #94a3b8; text-align: center; padding: 8px; font-size: 13px; border-bottom: 1px solid #334155;">
        👀 <strong>Read-Only Mode:</strong> Anda melihat papan ini sebagai penonton. Perubahan yang dibuat pemilik akan ter-update secara otomatis.
    </div>

    <!-- Modal Form (Popup Input Tugas Baru) -->
    <div id="task-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Create New Task</h2>
                <button id="close-modal-btn" class="close-btn">&times;</button>
            </div>
            
            <form id="task-form" class="modal-body">
                <label for="task-input">Task / Document Title</label>
                <input type="text" id="task-input" placeholder="e.g., Draft BAP Disiplin PNS..." required autocomplete="off">

                <label for="task-category">Category</label>
                <select id="task-category">
                    <option value="Letter">📄 Letter</option>
                    <option value="Report">📊 Report</option>
                    <option value="Notes">📝 Notes</option>
                    <option value="Other">📌 Other</option>
                </select>

                <!-- Input Link Google Docs -->
                <label for="task-link">Google Docs Link (Optional)</label>
                <input type="url" id="task-link" placeholder="https://docs.google.com/document/d/..." autocomplete="off">

                <button type="submit" id="add-btn" class="btn-submit">Create Task</button>
            </form>
        </div>
    </div>

    <!-- Kanban Board Grid (4 Columns) -->
    <main class="kanban-board">
        
        <!-- Column 1: To Do -->
        <div class="kanban-column" id="col-todo">
            <div class="column-header">
                <h2>To Do</h2>
                <span class="task-count" id="count-todo">0</span>
            </div>
            <div class="task-list" id="list-todo"></div>
        </div>

        <!-- Column 2: In Progress -->
        <div class="kanban-column" id="col-progress">
            <div class="column-header">
                <h2>In Progress</h2>
                <span class="task-count" id="count-progress">0</span>
            </div>
            <div class="task-list" id="list-progress"></div>
        </div>

        <!-- Column 3: In Review -->
        <div class="kanban-column" id="col-review">
            <div class="column-header">
                <h2>In Review</h2>
                <span class="task-count" id="count-review">0</span>
            </div>
            <div class="task-list" id="list-review"></div>
        </div>

        <!-- Column 4: Completed -->
        <div class="kanban-column" id="col-completed">
            <div class="column-header">
                <h2>Completed</h2>
                <span class="task-count" id="count-completed">0</span>
            </div>
            <div class="task-list" id="list-completed"></div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
